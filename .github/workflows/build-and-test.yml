name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, macos-13, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install gcc
      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-make
      - name: Compile HOLE
        if: runner.os != 'Windows'
        run: make -C src
      - name: Compile HOLE (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make -C src
          if [ -f exe/hole.exe ]; then
            cp exe/hole.exe exe/hole
          fi
      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: hole-${{ matrix.os }}
          path: exe

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, macos-13]
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install gcc
      - name: Install Python tooling
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.cargo/bin:${PATH}"
          uv venv .venv
          uv pip install --python .venv pytest
      - name: Prepare macOS legacy layout
        if: runner.os == 'macOS'
        run: |
          mkdir -p "${HOME}/hole2"
          rsync -a rad/ "${HOME}/hole2/rad/"
      - name: Download built executables
        uses: actions/download-artifact@v4
        with:
          name: hole-${{ matrix.os }}
          path: exe
      - name: Run example regression tests
        run: uv run --python .venv pytest
