name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-linux:
    name: Build (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make
      - name: Compile HOLE
        run: make -C src
      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: hole-ubuntu-latest
          path: exe

  build-macos-14:
    name: Build (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          brew update
          brew install gcc
      - name: Compile HOLE
        run: make -C src
      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: hole-macos-14
          path: exe

  build-macos-13:
    name: Build (macos-13)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          brew update
          brew install gcc
      - name: Compile HOLE
        run: make -C src
      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: hole-macos-13
          path: exe

  build-windows:
    name: Build (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-make
      - name: Compile HOLE
        shell: msys2 {0}
        run: |
          mingw32-make -C src
          if [ -f exe/hole.exe ] && [ ! -f exe/hole ]; then
            cp exe/hole.exe exe/hole
          fi
      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: hole-windows-latest
          path: exe

  test:
    name: Tests (${{ matrix.os }})
    needs: ${{ matrix.build_job }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            build_job: build-linux
            artifact: hole-ubuntu-latest
          - os: macos-14
            build_job: build-macos-14
            artifact: hole-macos-14
          - os: macos-13
            build_job: build-macos-13
            artifact: hole-macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install gcc
      - name: Install Python tooling
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.cargo/bin:${PATH}"
          uv venv .venv
          uv pip install --python .venv pytest
      - name: Prepare macOS legacy layout
        if: runner.os == 'macOS'
        run: |
          mkdir -p "${HOME}/hole2"
          rsync -a rad/ "${HOME}/hole2/rad/"
      - name: Download built executables
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: exe
      - name: Run example regression tests
        run: uv run --python .venv pytest
